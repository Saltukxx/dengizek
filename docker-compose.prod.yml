# VPS üretim dağıtımı — Docker Compose.
#
# Kullanım: bkz. deploy/README.md
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Not: Yerel geliştirme için kök docker-compose.yml (yalnızca Postgres)
# kullanılmaya devam eder — bu dosyaya dokunmaz, `npm run dev` akışını
# etkilemez.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dengizek-pg-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: dengizek
    volumes:
      - dengizek_pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dengizek"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Dışarıya port açılmaz — yalnızca app servisi iç ağdan erişir.

  app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dengizek-app
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # Compose iç ağında DATABASE_URL host'u "postgres" olmalı — db/index.ts
    # bunu otomatik algılayıp postgres.js sürücüsünü kullanır (Neon değil).
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: dengizek-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # SSL hazır olduğunda: - "443:443"
    volumes:
      - ./deploy/nginx/dengizek.conf:/etc/nginx/conf.d/default.conf:ro
      # Certbot webroot + sertifikalar domain hazır olunca eklenir:
      # - ./deploy/certbot/www:/var/www/certbot:ro
      # - ./deploy/certbot/conf:/etc/letsencrypt:ro

volumes:
  dengizek_pg_prod_data:
