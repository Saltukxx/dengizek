name: AI Engine Eval

# Gerçek Gemini çağrısı yapan yanıt-kalitesi eval'ları (src/lib/ai/evals/).
# CI yalnız golden eval'ı seed otelleriyle koşar; diğer eval'lar aktarılan
# otel verisini (data/oteldenrezerve, repoda değil) ister — yerelde koşulur.
# Anahtar: GEMINI_API_KEY secret'ı. Ücretsiz kota proje başına olduğundan
# canlıdan AYRI bir AI Studio projesi önerilir.
# PR/push'ta ÇALIŞMAZ — maliyet ve flakiness nedeniyle yalnızca gece
# (schedule) veya elle (workflow_dispatch) tetiklenir. Tek bir flaky fixture
# tüm run'ı kırmasın diye eşik bazlı geçme kullanılır (bkz. son adım).

on:
  schedule:
    - cron: "17 3 * * *" # her gece 03:17 UTC
  workflow_dispatch:

jobs:
  # Fork'larda / secret tanımsız repolarda eval'i boşuna başlatma —
  # secrets job-level if'te okunamadığından ayrı bir gate job'ı kullanılır.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        run: echo "has-key=${{ secrets.GEMINI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  eval:
    needs: gate
    if: needs.gate.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # hotel_fact_embeddings tablosu vector sütunu kullanıyor (pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: dengizek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dengizek"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5432/dengizek
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      PAYMENTS_ENABLED: "false"
      USE_MOCK_DATA: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: pgvector uzantısını etkinleştir
        run: PGPASSWORD=dev psql -h 127.0.0.1 -U postgres -d dengizek -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: npx drizzle-kit push --force
      - run: npm run db:seed
      # Hakem kararları koşular arasında saklanır: güçlü hakemin ücretsiz
      # kotası günde ~20 istek, yalnız yeni cevaplar hakeme gider.
      - name: Hakem önbelleği
        uses: actions/cache@v4
        with:
          path: apps/web/.eval-cache
          key: eval-judge-${{ github.run_id }}
          restore-keys: eval-judge-
      - name: Eval çalıştır (JSON rapor, tek fixture hatası run'ı kırmaz)
        run: npx vitest run --config vitest.eval.config.mts src/lib/ai/evals/golden-questions.eval.ts --reporter=json --outputFile=eval-results.json
        continue-on-error: true
      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          # eval-metrics.json: fixture başına gecikme/token/maliyet + guard
          # sızıntı sayacı (golden-questions.eval.ts afterAll yazıyor).
          path: |
            apps/web/eval-results.json
            apps/web/eval-metrics.json
      - name: Eşik değerlendirmesi (≥90% fixture geçmeli)
        run: |
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("eval-results.json", "utf8"));
            // Kota yüzünden atlanan fixture oranı düşürmez: payda geçen + kalan.
            const passed = report.numPassedTests ?? 0;
            const failed = report.numFailedTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            const decided = passed + failed;
            const rate = decided > 0 ? passed / decided : 0;
            console.log(`AI eval: ${passed}/${decided} fixture geçti (%${Math.round(rate * 100)})${skipped ? `, ${skipped} atlandı` : ""}`);
            if (skipped) console.log(`::warning::${skipped} fixture model kotası yüzünden koşulamadı.`);
            if (decided === 0) {
              console.error("Hiç fixture değerlendirilemedi (kota ya da kurulum) — eval-results.json kontrol edin.");
              process.exit(1);
            }
            try {
              const metrics = JSON.parse(fs.readFileSync("eval-metrics.json", "utf8"));
              const pending = metrics.judgePending ?? [];
              if (pending.length) console.log(`::warning::Hakem kotası doldu: ${pending.length} cevap denetlenemedi (geçti sayılmadı): ${pending.join(", ")}`);
            } catch {}
            if (rate < 0.9) {
              console.error("Geçme oranı %90 eşiğinin altında.");
              process.exit(1);
            }
          '
