services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + pgvector uzantısı (dosyaları
    # kurulu gelir, DB içinde ayrıca "CREATE EXTENSION IF NOT EXISTS vector;"
    # çalıştırılması gerekir — bkz. src/lib/db/schema.ts hotelFactEmbeddingsTable).
    # NOT: mevcut bir dengizek_pg_data volume'ünde image değişikliği tek
    # başına yetmez, extension'ı elle etkinleştirin (aşağıdaki komutla).
    image: pgvector/pgvector:pg16
    container_name: dengizek-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dengizek
    ports:
      # Ana makinede 5433 — 5432 sık sık başka projelerin postgres'i tarafından
      # tutuluyor. Farklı bir port gerekirse: POSTGRES_PORT=5544 docker compose up -d
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dengizek_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dengizek"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sesli yanıt (isteğe bağlı): docker compose --profile voice up -d piper
  # ve apps/web/.env.local'a PIPER_URL=http://localhost:5050 ekleyin.
  piper:
    profiles: ["voice"]
    build:
      context: ./deploy/piper
    container_name: dengizek-piper
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5000"

volumes:
  dengizek_pg_data:
