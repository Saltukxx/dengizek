services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + pgvector uzantısı (dosyaları
    # kurulu gelir, DB içinde ayrıca "CREATE EXTENSION IF NOT EXISTS vector;"
    # çalıştırılması gerekir — bkz. src/lib/db/schema.ts hotelFactEmbeddingsTable).
    # NOT: mevcut bir dengizek_pg_data volume'ünde image değişikliği tek
    # başına yetmez, extension'ı elle etkinleştirin (aşağıdaki komutla).
    image: pgvector/pgvector:pg16
    container_name: dengizek-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dengizek
    ports:
      - "5432:5432"
    volumes:
      - dengizek_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dengizek"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dengizek_pg_data:
