# Otelsayfam — nginx reverse proxy (HTTP, domain hazır olana kadar).
#
# Domain hazır olduğunda (bkz. deploy/README.md "SSL kurulumu"):
#   1. server_name _; -> server_name sizin-domaininiz.com;
#   2. certbot ile sertifika al (webroot yöntemi, aşağıdaki /.well-known
#      bloğu zaten hazır)
#   3. Bu dosyanın altına 443 server bloğunu ekle, 80 bloğunu 443'e
#      yönlendirmeye çevir (örnek blok en altta yorumlu duruyor)

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Certbot ACME doğrulaması için (webroot yöntemi) — domain hazır olunca
    # deploy/certbot/www volume'ü compose'da aktive edilir.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

