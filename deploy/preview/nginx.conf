# Otelsayfam önizleme — ters vekil.
#
# Tek görevi: uygulamayı doğrudan erişime kapatıp (app host portu yayınlamaz)
# önüne güvenilir bir hop koymak. Böylece istemci IP'si güvenilir olur
# (src/lib/rate-limit.ts requestIp): X-Real-IP her istekte gerçek bağlanan
# adresle EZİLİR ve X-Forwarded-For'daki istemci uydurması atılır — sahte
# başlıkla hız sınırı aşılamaz.
#
# NOT: Bu önizleme için HTTP'dir (TLS yok). Üretimde TLS ektikten sonra da
# aynı başlık kuralları geçerli kalmalı.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Güvenilir IP: istemci ne gönderirse göndersin üzerine yazılır.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
